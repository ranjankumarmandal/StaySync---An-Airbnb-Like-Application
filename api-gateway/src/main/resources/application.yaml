server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**

        - id: listing-service
          uri: http://localhost:8083
          predicates:
            - Path=/listings/**

        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/bookings/**

        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/payments/**

        - id: search-service
          uri: http://localhost:8088
          predicates:
            - Path=/search/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/notifications/**